name: Generate functions JSON

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run functions.py
        run: |
          python functions.py

      - name: Check generated JSON
        run: |
          ls -lh functions.json
          python -m json.tool functions.json > /dev/null
          echo "functions.json is valid JSON"

      - name: Commit generated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f functions.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update functions.json"
            git push
          fi
