name: BetPawa bot

on:
  # Run by hand: repo -> Actions tab -> "BetPawa bot" -> Run workflow
  workflow_dispatch:
  # Run on a schedule (times are UTC; Uganda is UTC+3, so 05:00 UTC = 08:00 in Kampala)
  schedule:
    - cron: "0 5 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Chrome is already installed on ubuntu-latest, and Selenium downloads the
      # matching chromedriver by itself.
      - name: Run the bot
        run: python pbot.py

      - name: Save the results
        if: always()          # also keep debug files when the run fails
        uses: actions/upload-artifact@v4
        with:
          name: bot-results
          path: |
            picks.csv
            booking_code.txt
            debug_*.png
            debug_*.html
          if-no-files-found: ignore
